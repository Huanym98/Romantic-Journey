<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Romantic Journey · 找旅行搭子</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <div class="brand"><img src="assets/logo.svg" alt="浪漫之旅 Logo" /></div>
        <nav class="nav-links">
          <a href="#">首页</a>
          <a href="#">找搭子</a>
          <a href="#">行程广场</a>
          <a href="#">旅行社区</a>
        </nav>
        <button id="profileToggle" class="user-chip" type="button" aria-expanded="false">
          <img src="https://images.unsplash.com/photo-1438761681033-6461ffad8d80?auto=format&fit=crop&w=200&q=80" alt="用户头像" />
          <span>
            <strong>旅行喵喵</strong>
            <small>个人资料</small>
          </span>
        </button>
      </div>
    </header>

    <section class="hero-strip">
      <h1>筛选更精准，结伴更靠谱</h1>
      <p>支持行程标签、具体日程安排、点赞与发布时间，并提供最新/最热/综合排序。</p>
    </section>

    <aside id="profilePanel" class="profile-panel" hidden>
      <div class="panel-head">
        <h2>编辑个人资料</h2>
        <button id="panelClose" class="ghost" type="button">关闭</button>
      </div>
      <p class="hint">注册时填写，后续可随时修改（仅生日 / MBTI / 星座 / 技能 + 旅行偏好）。</p>
      <form id="profileForm" class="grid">
        <label>生日 <input required type="date" name="birthday" /></label>
        <label>MBTI
          <select name="mbti">
            <option value="ENFP">ENFP</option><option value="ENFJ">ENFJ</option><option value="ENTP">ENTP</option><option value="ENTJ">ENTJ</option>
            <option value="INFP">INFP</option><option value="INFJ">INFJ</option><option value="INTP">INTP</option><option value="INTJ">INTJ</option>
            <option value="ESFP">ESFP</option><option value="ESFJ">ESFJ</option><option value="ESTP">ESTP</option><option value="ESTJ">ESTJ</option>
            <option value="ISFP">ISFP</option><option value="ISFJ">ISFJ</option><option value="ISTP">ISTP</option><option value="ISTJ">ISTJ</option>
          </select>
        </label>
        <label>星座
          <select name="zodiac">
            <option value="白羊座">白羊座</option><option value="金牛座">金牛座</option><option value="双子座">双子座</option><option value="巨蟹座">巨蟹座</option>
            <option value="狮子座">狮子座</option><option value="处女座">处女座</option><option value="天秤座">天秤座</option><option value="天蝎座">天蝎座</option>
            <option value="射手座">射手座</option><option value="摩羯座">摩羯座</option><option value="水瓶座">水瓶座</option><option value="双鱼座">双鱼座</option>
          </select>
        </label>
        <label>旅行节奏 <select name="pace"><option value="特种兵式">特种兵式</option><option value="平衡">平衡</option><option value="慢游">慢游</option></select></label>
        <label>预算级别 <select name="budgetLevel"><option value="经济">经济</option><option value="舒适">舒适</option><option value="品质">品质</option></select></label>
        <label>起床时间偏好 <select name="wakeUp"><option value="早起">早起</option><option value="自然醒">自然醒</option><option value="夜猫">夜猫</option></select></label>
        <label>社交强度 <select name="social"><option value="外向">外向</option><option value="适中">适中</option><option value="安静">安静</option></select></label>
        <label class="full-width">技能标签（可多选）
          <div id="skillGroup" class="skill-group">
            <label><input type="checkbox" name="skills" value="会拍照" />会拍照</label>
            <label><input type="checkbox" name="skills" value="海外自驾经验" />海外自驾经验</label>
            <label><input type="checkbox" name="skills" value="有驾照" />有驾照</label>
            <label><input type="checkbox" name="skills" value="有相机" />有相机</label>
            <label><input type="checkbox" name="skills" value="有无人机" />有无人机</label>
            <label><input type="checkbox" name="skills" value="有Pocket" />有Pocket</label>
          </div>
        </label>
        <button type="submit">保存资料</button>
      </form>
    </aside>

    <main class="layout">
      <section class="card">
        <h2>1) 发布行程帖</h2>
        <form id="tripForm" class="grid">
          <label>目的地 <input required name="destination" placeholder="例如：纽约" /></label>
          <label>出发时间 <input required type="date" name="departDate" /></label>
          <label>返程时间 <input required type="date" name="returnDate" /></label>
          <label>预算（元） <input required type="number" min="200" name="budget" /></label>
          <label>行程标签（逗号分隔） <input required name="tags" placeholder="citywalk,美食,摄影" /></label>
          <label>想去景点 <input required name="spots" placeholder="中央公园, 时代广场" /></label>
          <label class="full-width">具体行程安排
            <textarea required name="itinerary" rows="4" placeholder="D1 上午中央公园，午餐Joe's Pizza，晚上时代广场；D2...\n"></textarea>
          </label>
          <label>旅行节奏 <select name="pace"><option value="特种兵式">特种兵式</option><option value="平衡">平衡</option><option value="慢游">慢游</option></select></label>
          <label>作息 <select name="wakeUp"><option value="早起">早起</option><option value="自然醒">自然醒</option><option value="夜猫">夜猫</option></select></label>
          <label>性格偏好 <select name="social"><option value="外向">外向</option><option value="适中">适中</option><option value="安静">安静</option></select></label>
          <button type="submit">发布并匹配</button>
        </form>
      </section>

      <section class="card">
        <h2>2) 快速匹配区</h2>
        <div class="toolbar">
          <input id="searchInput" placeholder="按目的地搜索（如 成都）" />
          <select id="styleFilter"><option value="all">全部节奏</option><option value="特种兵式">特种兵式</option><option value="平衡">平衡</option><option value="慢游">慢游</option></select>
          <select id="mbtiFilter"><option value="all">全部 MBTI</option></select>
          <select id="zodiacFilter"><option value="all">全部星座</option></select>
          <select id="sortFilter">
            <option value="comprehensive">综合排序</option>
            <option value="newest">最新排序</option>
            <option value="hottest">最热排序</option>
          </select>
          <button id="seedBtn" class="secondary" type="button">重置示例数据</button>
        </div>
        <div id="tripList" class="cards"></div>
      </section>

      <section class="card">
        <h2>3) 我的互动记录</h2>
        <div class="stats" id="stats"></div>
      </section>

      <section class="card">
        <h2>4) 我的旅行主页</h2>
        <div class="profile-grid">
          <section>
            <h3>旅行记忆墙（图片 / 视频）</h3>
            <form id="mediaForm" class="grid media-form">
              <label>内容类型 <select name="type"><option value="图片">图片</option><option value="视频">视频</option></select></label>
              <label>目的地 <input required name="location" placeholder="例如：冰岛" /></label>
              <label>封面 URL <input required name="cover" placeholder="https://..." /></label>
              <label>标题 <input required name="caption" placeholder="极光追逐日记" /></label>
              <button type="submit">发布到主页</button>
            </form>
            <div id="mediaList" class="media-wall"></div>
          </section>
          <section>
            <h3>国家足迹与成就勋章</h3>
            <div id="countryList" class="country-list"></div>
            <div id="badgeList" class="badge-list"></div>
          </section>
        </div>
      </section>
    </main>

    <template id="tripTemplate">
      <article class="trip-item">
        <header><h3></h3><span class="score"></span></header>
        <p class="meta"></p>
        <p class="publish"></p>
        <p class="spots"></p>
        <p class="itinerary"></p>
        <ul class="tags"></ul>
        <ul class="chips"></ul>
        <p class="trust"></p>
        <footer>
          <button data-action="like">👍 点赞</button>
          <button data-action="dislike" class="danger">👎 不喜欢</button>
          <button data-action="save" class="secondary">⭐ 收藏</button>
          <button data-action="connect" class="ghost">💬 私聊意向</button>
        </footer>
      </article>
    </template>

    <template id="mediaTemplate">
      <article class="media-item">
        <img alt="旅行分享封面" loading="lazy" />
        <div><p class="media-title"></p><p class="media-meta"></p></div>
      </article>
    </template>

    <script src="script.js"></script>
  </body>
</html>
